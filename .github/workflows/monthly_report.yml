name: Monthly study report

on:
  schedule:
    # 09:00 UTC on the 1st of each month
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report (YYYY-MM); leave blank for current month"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  report:
    name: Generate monthly report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v4.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Generate report
        id: gen
        run: |
          MONTH_ARG=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            MONTH_ARG="--month ${{ github.event.inputs.month }}"
          fi
          # Capture summary for the issue body
          SUMMARY=$(uv run lll-monthly-report $MONTH_ARG)
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit report
        run: |
          git config user.name "leadlaglab-bot"
          git config user.email "leadlaglab@gmail.com"
          git add study/reports/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            PERIOD="${{ github.event.inputs.month || '' }}"
            if [ -z "$PERIOD" ]; then
              PERIOD=$(date '+%Y-%m')
            fi
            git commit -m "report: ${PERIOD} state of the study"
            git push
          fi

      - name: Open GitHub Issue with summary
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const period = '${{ github.event.inputs.month }}' || new Date().toISOString().slice(0, 7);
            const body = `${{ steps.gen.outputs.summary }}\n\n` +
              `---\n*Generated by the [monthly report workflow]` +
              `(${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Monthly Report] State of the Study — ${period}`,
              body: body,
              labels: ['monthly-report'],
            });
