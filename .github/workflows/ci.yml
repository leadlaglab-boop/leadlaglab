name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v4.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check pipeline/ tests/

      - name: Ruff format check
        run: uv run ruff format --check pipeline/ tests/

      - name: Mypy
        run: uv run mypy pipeline/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v4.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Pytest (including leakage tests)
        run: uv run pytest --cov=pipeline --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303  # v5.1.1
        with:
          files: coverage.xml
        continue-on-error: true  # coverage upload failure doesn't block CI

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # gitleaks needs full history

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v4.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: pip-audit
        run: uv run pip-audit

  site-build:
    name: Astro build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: npm audit
        # --audit-level=critical: 3 remaining highs are http-cache-semantics in Astro's
        # build-time transitive deps (not runtime, not user-facing). Cannot be fixed without
        # downgrading Astro below the patched XSS versions. Tracked in GHSA-ch52-4w7c-c8xp.
        run: npm audit --audit-level=critical

      - name: Astro build
        run: npm run build
        env:
          SITE_URL: https://leadlaglab.com
