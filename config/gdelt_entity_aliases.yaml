# GDELT entity search aliases: ticker → list of search strings.
#
# GDELT indexes article text. These aliases are used to query the GDELT DOC API.
# Rules:
# - Use quoted phrases where possible to reduce false matches.
# - "ambiguous: true" means the company name appears in many unrelated contexts;
#   these are flagged in the data-quality dashboard and sampled in the precision audit.
# - For ambiguous names, we require BOTH the company name AND a disambiguating term.
#
# Precision audit: every quarter, 200 randomly sampled company-article pairs are
# hand-labeled and precision is published on the site (see pipeline/validate/precision_audit.py).

version: "2026-10-03"

aliases:

  # Format: primary_query is used alone if unambiguous;
  # disambiguated_query is used for ambiguous names.

  AAPL:   {primary: '"Apple Inc"', ambiguous: false}
  MSFT:   {primary: '"Microsoft"', ambiguous: false}
  GOOGL:  {primary: '"Alphabet Inc" OR "Google"', ambiguous: false}
  GOOG:   {primary: '"Alphabet Inc" OR "Google"', ambiguous: false}
  AMZN:   {primary: '"Amazon"', ambiguous: false}
  META:   {primary: '"Meta Platforms" OR "Facebook"', ambiguous: false}
  NVDA:   {primary: '"Nvidia"', ambiguous: false}
  TSLA:   {primary: '"Tesla"', ambiguous: false}
  AVGO:   {primary: '"Broadcom"', ambiguous: false}
  ORCL:   {primary: '"Oracle Corporation" OR "Oracle Corp"', ambiguous: false}
  CRM:    {primary: '"Salesforce"', ambiguous: false}
  ADBE:   {primary: '"Adobe"', ambiguous: false}
  AMD:    {primary: '"Advanced Micro Devices" OR "AMD"', ambiguous: false}
  INTC:   {primary: '"Intel"', ambiguous: false}
