# Retail-attention basket — analyzed separately from S&P 500 core.
#
# Inclusion rule (pre-registered): a ticker is eligible for this cohort if,
# at the time of inclusion, it has demonstrated at least ONE of:
#   (a) sustained abnormal retail trading volume (>2x 90-day average) for
#       5+ consecutive trading days as measured by a public source, OR
#   (b) short interest >= 10% of float per FINRA or equivalent filing data, OR
#   (c) documented retail social-media attention event (e.g., top-trending
#       on StockTwits or Reddit r/wallstreetbets for 3+ days in a 30-day window).
# Additions and removals are timestamped and appended; the list is never
# retroactively rewritten.
#
# IMPORTANT: This cohort is always evaluated separately from S&P 500.
# Cross-cohort mixing is not permitted in any signal evaluation.

version: "2026-10-03"

