# Wikipedia article mappings: ticker → article title(s).
#
# Manual overrides for companies whose article title doesn't match the common name.
# Any ticker NOT listed here is auto-looked up via the Wikipedia opensearch API
# the first time it is needed; the result is cached in the archive.
#
# Rules for this file:
# - Use the exact article title (spaces OK; the fetcher URL-encodes it)
# - "articles" is a list; when multiple articles apply (e.g. products, subsidiaries)
#   their pageviews are summed.
# - "ambiguous: true" marks cases where entity matching is uncertain; these are
#   flagged in the data-quality dashboard and included in the precision audit.

version: "2026-10-03"

overrides:

