[project]
name = "leadlaglab"
version = "0.1.0"
description = "Alt-data signal research pipeline for Lead/Lag Lab"
requires-python = ">=3.12"
dependencies = [
    # Data
    "polars>=1.0",
    "pyarrow>=17.0",
    "pandas>=2.2",                     # pandas_market_calendars requires pandas
    "pandas-market-calendars>=4.4",
    # Validation
    "pydantic>=2.8",
    "pandera[polars]>=0.20",
    # Stats / ML
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "scipy>=1.13",
    # NLP
    "transformers>=4.44",
    "torch>=2.4",                      # CPU-only FinBERT inference
    "vaderSentiment>=3.3",
    # Data sources
    "pytrends>=4.9",
    "requests>=2.32",
    "httpx>=0.27",
    # Utilities
    "python-dotenv>=1.0",
    "tenacity>=8.5",                   # retry with backoff
    "structlog>=24.0",                 # structured logging
    "rich>=13.0",                      # CLI output
    "typer>=0.12",                     # CLI entrypoints
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "types-requests",
    "types-PyYAML",
    "types-python-dateutil",
    "pandas-stubs",
    "scipy-stubs",
]

[project.scripts]
lll-ingest = "pipeline.cli:ingest"
lll-features = "pipeline.cli:features"
lll-evaluate = "pipeline.cli:evaluate"
lll-predict = "pipeline.cli:predict"
lll-build-site = "pipeline.cli:build_site"
lll-monthly-report = "pipeline.cli:monthly_report"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # typer.Option() in defaults is idiomatic Typer
    "TCH001", # no strict TYPE_CHECKING protocol for this project
    "TCH002", # no strict TYPE_CHECKING protocol for this project
    "TCH003", # no strict TYPE_CHECKING protocol for this project
    "N803",   # X / Xy / X_feat are standard ML variable names
    "N806",   # same
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# Third-party packages that ship neither inline types nor a stubs package.
[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
    "pandas_market_calendars.*",
    "pytrends.*",
    "yfinance.*",
    "sklearn.*",
    "statsmodels.*",
    "vaderSentiment.*",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is opt-in: pass --cov manually or use `make coverage`.
# Omitting it here prevents torch/transformers from being instrumented on every run.
addopts = "-q"

[tool.coverage.run]
source = ["pipeline"]
omit = [
    "tests/*",
    "pipeline/signals/nlp.py",   # torch/transformers; slow to instrument
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "yfinance>=1.7.0",
]
